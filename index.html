<style>

#usl-liga *{box-sizing:border-box}

#usl-liga .usl-sports{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 16px}
#usl-liga .usl-sport{border:1px solid var(--usl-blue);background:#fff;color:var(--usl-blue);border-radius:4px;padding:9px 18px;font-weight:700;font-size:15px}

#usl-liga .usl-nav:hover:not([disabled]){background:rgba(255,255,255,.14)}

#usl-liga .usl-day{text-align:center;color:var(--usl-blue);font-size:19px;font-weight:700;margin:22px 0 10px}

<script>
(function () {
  var root = document.getElementById('usl-liga');
  if (!root) return;
  if (root.dataset.uslInit) return;   // blok prilepljen dvakrat naj se ne zažene dvakrat
  root.dataset.uslInit = '1';

  var SHEET = root.getAttribute('data-sheet');
  var BANNER = root.getAttribute('data-banner') || '';
  // Imena športov = imena listov v Google Sheetu
  var SPORTS = ['Košarka', 'Nogomet', 'Odbojka M', 'Odbojka Ž'];
  var TITLES = { 'Košarka': 'Košarka', 'Nogomet': 'Nogomet', 'Odbojka M': 'Odbojka (M)', 'Odbojka Ž': 'Odbojka (Ž)' };

  // Na koliko časa se podatki štejejo za zastarele (ms)
  var SVEZE = 120000;

  // Točkovanje in razvrstitev po Pravilniku USL UM 2026/2027
  // Odbojka: igra se na dva dobljena niza, zmaga 2:0 ali 2:1 prinese 2 točki.
  function volley(a, b) { return a > b ? [2, 0] : [0, 2]; }

  // Koliko mest na lestvici se uvrsti v končnico (četrtfinale E1-E8; 0 = brez črte)
  var PLAYOFF = 8;

  // Opomba s to besedo pomeni neopravičen izostanek: poražencu se odbije 1 točka.
  var KAZEN = /neopravi/i;

  var KAZEN_NOTE = ' Neopravičen izostanek: −1 točka.';
  var RULES = {
    'Košarka':   { draw: false, diff: 'Koši', kolicnik: false,
      note: 'Zmaga 2 točki, poraz 0 točk. Predana tekma se registrira z 20:0. Pri enakem številu točk odloča razlika v koših na vseh tekmah, nato na medsebojni tekmi.' + KAZEN_NOTE,
      pts: function (a, b) { return a > b ? [2, 0] : [0, 2]; } },
    'Nogomet':   { draw: true, diff: 'Goli', kolicnik: false,
      note: 'Zmaga 3 točke, neodločeno 1 točka, poraz 0 točk. Pri enakem številu točk odloča razlika v zadetkih na vseh tekmah, nato na medsebojni tekmi.' + KAZEN_NOTE,
      pts: function (a, b) { return a > b ? [3, 0] : a < b ? [0, 3] : [1, 1]; } },
    'Odbojka M': { draw: false, diff: 'Nizi', kolicnik: true,
      note: 'Zmaga z 2:0 ali 2:1 prinese 2 točki, poraz 0 točk. Pri enakem številu točk odloča količnik nizov, nato količnik točk v nizih, nato medsebojna tekma.' + KAZEN_NOTE,
      pts: volley },
    'Odbojka Ž': { draw: false, diff: 'Nizi', kolicnik: true,
      note: 'Zmaga z 2:0 ali 2:1 prinese 2 točki, poraz 0 točk. Pri enakem številu točk odloča količnik nizov, nato količnik točk v nizih, nato medsebojna tekma.' + KAZEN_NOTE,
      pts: volley }
  };

  var MES = ['januar', 'februar', 'marec', 'april', 'maj', 'junij', 'julij', 'avgust', 'september', 'oktober', 'november', 'december'];
  var MES_K = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'avg', 'sep', 'okt', 'nov', 'dec'];
  var DAN = ['nedelja', 'ponedeljek', 'torek', 'sreda', 'četrtek', 'petek', 'sobota'];

  var state = { sport: SPORTS[0], view: 'tekme', krog: null, faza: 'Vse' };
  var tekme = [], ekipe = {};
  var podpis = '', zadnjic = 0, timer = null;

  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }
  // Barva gre v style atribut, zato dovolimo samo zapis #rgb do #rrggbbaa
  function barva(v) { return /^#[0-9a-f]{3,8}$/i.test(v || '') ? v : '#016085'; }
  function url(sheet) { return 'https://docs.google.com/spreadsheets/d/' + SHEET + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(sheet) + '&t=' + Date.now(); }

  function parseCSV(text) {
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
      else if (c !== '\r') f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    var head = (rows.shift() || []).map(function (h) { return h.trim(); });
    return rows.filter(function (r) { return r.some(function (x) { return x.trim(); }); }).map(function (r) {
      var o = {}; head.forEach(function (h, j) { o[h] = (r[j] || '').trim(); }); return o;
    });
  }

  function num(v) { if (v === '' || v == null) return null; var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; }
  function dateOf(s) { var p = (s || '').split('-'); if (p.length !== 3) return null; var d = new Date(+p[0], +p[1] - 1, +p[2]); return isNaN(d.getTime()) ? null : d; }
  function played(t) { return t.rd !== null && t.rg !== null; }

  // Vrne true, če so podatki novi in je izris potreben.
  // Če en list odpove, ostali vseeno pridejo skozi; napako javimo šele, če odpovejo vsi.
  function load() {
    var reqs = SPORTS.concat(['Ekipe']).map(function (name) {
      return fetch(url(name))
        .then(function (r) { if (!r.ok) throw new Error(name); return r.text(); })
        .catch(function () { return null; });
    });
    return Promise.all(reqs).then(function (res) {
      if (res.every(function (x) { return x === null; })) throw new Error('noben list ni dosegljiv');
      zadnjic = Date.now();
      var nov = res.join('\u0000');
      if (nov === podpis) return false;   // nič se ni spremenilo, DOM pustimo pri miru
      podpis = nov;
      tekme = [];
      SPORTS.forEach(function (sport, i) {
        if (res[i] === null) return;
        parseCSV(res[i]).forEach(function (t) {
          var m = { sport: sport, faza: t.faza || '', krog: num(t.krog), datum: t.datum || '', ura: t.ura || '', lokacija: t.lokacija || '',
                    d: (t.domaci || '').toUpperCase(), g: (t.gostje || '').toUpperCase(), rd: num(t.rez_d), rg: num(t.rez_g),
                    nizi: t.nizi || '', opomba: t.opomba || '' };
          if (m.d && m.g) tekme.push(m);
        });
      });
      if (res[SPORTS.length] !== null) {
        ekipe = {};
        parseCSV(res[SPORTS.length]).forEach(function (e) { if (e.kratica) ekipe[e.kratica.toUpperCase()] = e; });
      }
      return true;
    });
  }

  // Barvni krogec s kratico; polno ime ekipe stoji ob njem.
  function krogec(k) {
    var e = ekipe[k] || {};
    return '<span class="usl-logo" style="background:' + barva(e.barva) + '" title="' + esc(e.ime || k) + '">' + esc(k) + '</span>';
  }

  function sportMatches() { return tekme.filter(function (t) { return t.sport === state.sport; }); }

  function defaultKrog(list) {
    var kr = rounds(list);
    if (!kr.length) return null;
    for (var i = 0; i < kr.length; i++) {
      if (list.some(function (t) { return t.krog === kr[i] && !played(t) && !t.opomba; })) return kr[i];
    }
    return kr[kr.length - 1];
  }
  function rounds(list) {
    var s = {}; list.forEach(function (t) { if (t.krog !== null) s[t.krog] = 1; });
    return Object.keys(s).map(Number).sort(function (a, b) { return a - b; });
  }
  function fazeOf(list) {
    var s = {}; list.forEach(function (t) { s[t.faza] = 1; });
    return Object.keys(s).sort();
  }

  // Število tekem in razpon datumov za vsak krog, v enem prehodu čez seznam
  function povzetekKrogov(list) {
    var po = {};
    list.forEach(function (t) {
      if (t.krog === null) return;
      if (state.faza !== 'Vse' && t.faza !== state.faza) return;
      var o = po[t.krog] || (po[t.krog] = { n: 0, a: null, b: null });
      o.n++;
      var d = dateOf(t.datum);
      if (d) { if (!o.a || d < o.a) o.a = d; if (!o.b || d > o.b) o.b = d; }
    });
    return po;
  }
  function obdobje(o) {
    if (!o || !o.a) return '';
    var a = o.a, b = o.b;
    if (+a === +b) return a.getDate() + '. ' + MES_K[a.getMonth()];
    if (a.getMonth() === b.getMonth()) return a.getDate() + '.–' + b.getDate() + '. ' + MES_K[b.getMonth()];
    return a.getDate() + '. ' + MES_K[a.getMonth()] + ' – ' + b.getDate() + '. ' + MES_K[b.getMonth()];
  }
  function stTekem(n) { return n + (n === 1 ? ' tekma' : n === 2 ? ' tekmi' : n === 3 || n === 4 ? ' tekme' : ' tekem'); }

  function ekipaCell(k, cls) {
    return '<div class="usl-team' + cls + '">' + krogec(k) + '</div>';
  }

  function matchCard(t) {
    var p = played(t), hl = p && t.rd < t.rg, gl = p && t.rg < t.rd;
    var score = p ? '<div class="usl-score">' + t.rd + ':' + t.rg + '</div>'
                  : '<div class="usl-score time">' + esc(t.ura || '–') + '</div>';
    var h = '<div class="usl-match">' +
      '<div class="usl-meta"><strong>' + esc(t.faza) + (t.krog !== null ? ' – ' + t.krog + '. krog' : '') + '</strong><br>' +
      esc(t.lokacija) + (p && t.ura ? ' · ' + esc(t.ura) : '') + '</div>' +
      '<div class="usl-row">' +
      ekipaCell(t.d, ' home' + (hl ? ' lost' : '')) +
      score +
      ekipaCell(t.g, gl ? ' lost' : '') +
      '</div>';
    if (p && t.nizi) h += '<div class="usl-sets">' + esc(t.nizi) + '</div>';
    if (t.opomba) h += '<div class="usl-badge">' + esc(t.opomba) + '</div>';
    return h + '</div>';
  }

  function renderTekme(list) {
    var f = list.filter(function (t) { return t.krog === state.krog && (state.faza === 'Vse' || t.faza === state.faza); });
    if (!f.length) return '<div class="usl-msg">V tem krogu ni tekem.</div>';
    f.sort(function (a, b) { return (a.datum + a.ura).localeCompare(b.datum + b.ura); });
    var out = '', last = null;
    f.forEach(function (t) {
      if (t.datum !== last) {
        var d = dateOf(t.datum);
        if (d) out += '<div class="usl-day">' + DAN[d.getDay()] + ', ' + d.getDate() + '. ' + MES[d.getMonth()] + ' ' + d.getFullYear() + '</div>';
        else if (t.datum) out += '<div class="usl-day">' + esc(t.datum) + '</div>';
        last = t.datum;
      }
      out += matchCard(t);
    });
    return out;
  }

  // "25:20, 25:22" -> [50, 42]; za količnik točk v nizih pri odbojki
  function tockeNizov(nizi) {
    var d = 0, g = 0;
    (nizi || '').split(',').forEach(function (niz) {
      var p = niz.split(':');
      if (p.length !== 2) return;
      var a = parseInt(p[0], 10), b = parseInt(p[1], 10);
      if (isNaN(a) || isNaN(b)) return;
      d += a; g += b;
    });
    return [d, g];
  }

  function standings(list, faza, doKroga) {
    var R = RULES[state.sport], T = {}, med = {};
    function row(k) { return T[k] || (T[k] = { k: k, t: 0, z: 0, n: 0, p: 0, za: 0, pr: 0, tz: 0, tp: 0, pts: 0 }); }
    list.forEach(function (m) {
      if (m.faza !== faza) return;
      if (doKroga != null && (m.krog === null || m.krog > doKroga)) return;
      var a = row(m.d), b = row(m.g);
      if (!played(m)) return;
      var pt = R.pts(m.rd, m.rg);
      a.t++; b.t++; a.za += m.rd; a.pr += m.rg; b.za += m.rg; b.pr += m.rd; a.pts += pt[0]; b.pts += pt[1];
      if (KAZEN.test(m.opomba)) {
        if (m.rd < m.rg) a.pts -= 1; else if (m.rg < m.rd) b.pts -= 1;
      }
      if (R.kolicnik) {
        var tn = tockeNizov(m.nizi);
        a.tz += tn[0]; a.tp += tn[1]; b.tz += tn[1]; b.tp += tn[0];
      }
      if (m.rd > m.rg) { a.z++; b.p++; } else if (m.rd < m.rg) { b.z++; a.p++; } else { a.n++; b.n++; }
      med[m.d + '|' + m.g] = m.rd - m.rg;
    });
    // Razlika na medsebojni tekmi z vidika ekipe x (liga je enokrožna, par se sreča enkrat)
    function medsebojno(x, y) {
      if (med[x.k + '|' + y.k] != null) return med[x.k + '|' + y.k];
      if (med[y.k + '|' + x.k] != null) return -med[y.k + '|' + x.k];
      return 0;
    }
    return Object.keys(T).map(function (k) { return T[k]; }).sort(function (x, y) {
      if (y.pts !== x.pts) return y.pts - x.pts;
      if (R.kolicnik) {
        var kn = kol(y.za, y.pr) - kol(x.za, x.pr);   // količnik nizov
        if (kn) return kn;
        var kt = kol(y.tz, y.tp) - kol(x.tz, x.tp);   // količnik točk v nizih
        if (kt) return kt;
      } else {
        var d = (y.za - y.pr) - (x.za - x.pr);
        if (d) return d;
      }
      var h = medsebojno(y, x);
      if (h) return h;
      return x.k.localeCompare(y.k);
    });
  }

  // Zadnji krog z odigrano tekmo - od njega se meri premik po lestvici
  function zadnjiOdigraniKrog(list, faza) {
    var k = null;
    list.forEach(function (m) {
      if (m.faza !== faza || m.krog === null || !played(m)) return;
      if (k === null || m.krog > k) k = m.krog;
    });
    return k;
  }

  // Mesta na lestvici, kakršna so bila pred zadnjim odigranim krogom
  function prejsnjaMesta(list, faza) {
    var zk = zadnjiOdigraniKrog(list, faza), mesta = {};
    if (zk === null) return mesta;
    var prej = standings(list, faza, zk - 1);
    if (!prej.some(function (r) { return r.t > 0; })) return mesta;
    prej.forEach(function (r, i) { mesta[r.k] = i; });
    return mesta;
  }

  function premik(prej, k, i) {
    if (prej[k] == null || prej[k] === i) return '';
    return prej[k] > i ? '<span class="usl-mv up" title="napredoval">&#9650;</span>'
                       : '<span class="usl-mv down" title="nazadoval">&#9660;</span>';
  }

  // Količnik po pravilniku: brez porazov je "max.", brez odigranega pa 0,
  // da se ekipa brez tekem ne izenači z vsemi ostalimi.
  function kol(a, b) { return b ? a / b : (a ? Infinity : 0); }
  function kolStr(a, b, dec) {
    if (!b) return a ? 'max.' : '0';
    if (!a) return '0';
    var v = a / b;
    return (dec ? v.toFixed(dec) : String(Math.round(v * 1000) / 1000)).replace('.', ',');
  }

  function renderLestvica(list) {
    var R = RULES[state.sport], out = '', jeCrta = false;
    fazeOf(list).forEach(function (fz) {
      if (state.faza !== 'Vse' && fz !== state.faza) return;
      var rows = standings(list, fz), prej = prejsnjaMesta(list, fz);
      var crta = PLAYOFF > 0 && rows.length > PLAYOFF;
      var glava = '<tr><th rowspan="2">Mesto</th><th rowspan="2" class="t">Ekipa</th>' +
        '<th colspan="' + (R.draw ? 3 : 2) + '">Tekme</th>' +
        (R.kolicnik
          ? '<th colspan="3">Seti</th><th colspan="3">Točke v setih</th>'
          : '<th colspan="3">' + R.diff + '</th>') +
        '<th rowspan="2">Točke</th></tr><tr><th>Zmage</th>' +
        (R.draw ? '<th>Neodločeno</th>' : '') + '<th>Porazi</th>' +
        (R.kolicnik
          ? '<th>Zmage</th><th>Porazi</th><th>Količnik</th><th>Zmage</th><th>Porazi</th><th>Količnik</th>'
          : '<th>Dani</th><th>Prejeti</th><th>Razlika</th>') +
        '</tr>';
      out += '<div class="usl-group">' + esc(fz) + '</div><div class="usl-wrap"><table><thead>' + glava + '</thead><tbody>';
      rows.forEach(function (r, i) {
        var d = r.za - r.pr;
        var celice = '<td>' + r.z + '</td>' + (R.draw ? '<td>' + r.n + '</td>' : '') + '<td>' + r.p + '</td>' +
          (R.kolicnik
            ? '<td>' + r.za + '</td><td>' + r.pr + '</td><td>' + kolStr(r.za, r.pr) + '</td>' +
              '<td>' + r.tz + '</td><td>' + r.tp + '</td><td>' + kolStr(r.tz, r.tp, 3) + '</td>'
            : '<td>' + r.za + '</td><td>' + r.pr + '</td><td>' + (d > 0 ? '+' : '') + d + '</td>');
        out += '<tr' + (crta && i === PLAYOFF - 1 ? ' class="cut"' : '') + '>' +
          '<td class="r">' + premik(prej, r.k, i) + (i + 1) + '.</td>' +
          '<td class="t">' + krogec(r.k) + '</td>' + celice +
          '<td class="p">' + r.pts + '</td></tr>';
      });
      out += '</tbody></table></div>';
      if (crta) jeCrta = true;
    });
    return out + '<div class="usl-note">' +
      (jeCrta ? 'Ekipe nad črto se uvrstijo v končnico. ' : '') + R.note + '</div>';
  }

  // Puščici ob traku krogov: skrijeta se, ko ni kaj drsati, in ugasneta na koncih.
  function osveziPuscice() {
    var trak = root.querySelector('.usl-rounds');
    if (!trak) return;
    var prej = root.querySelector('.usl-nav[data-nav="-1"]');
    var nasl = root.querySelector('.usl-nav[data-nav="1"]');
    var max = trak.scrollWidth - trak.clientWidth;
    var skrij = max <= 2;
    if (prej) { prej.style.display = skrij ? 'none' : ''; prej.disabled = trak.scrollLeft <= 2; }
    if (nasl) { nasl.style.display = skrij ? 'none' : ''; nasl.disabled = trak.scrollLeft >= max - 2; }
  }

  function render() {
    var list = sportMatches();
    if (state.krog === null || !list.some(function (t) { return t.krog === state.krog; })) state.krog = defaultKrog(list);
    var faze = fazeOf(list);
    if (state.faza !== 'Vse' && faze.indexOf(state.faza) < 0) state.faza = 'Vse';

    var h = '<div class="usl-sports">' + SPORTS.map(function (s) {
      return '<button type="button" class="usl-sport' + (s === state.sport ? ' on' : '') + '" data-sport="' + esc(s) + '">' + esc(TITLES[s]) + '</button>';
    }).join('') + '</div>';

    h += '<div class="usl-head"><div class="usl-title">' + esc(TITLES[state.sport]) + '</div>' +
         '<div class="usl-sub">' + (state.view === 'tekme' ? 'Razpored in rezultati po krogih' : 'Lestvica') + '</div>';
    if (state.view === 'tekme') {
      var po = povzetekKrogov(list);
      h += '<div class="usl-nav-wrap">' +
        '<button type="button" class="usl-nav" data-nav="-1" aria-label="Prejšnji krogi">&#8249;</button>' +
        '<div class="usl-rounds">' + rounds(list).map(function (k) {
          var o = po[k];
          return '<button type="button" class="usl-round' + (k === state.krog ? ' on' : '') + '" data-krog="' + k + '"><b>' + k + '. krog</b><span>' +
            obdobje(o) + '</span><span>' + stTekem(o ? o.n : 0) + '</span></button>';
        }).join('') + '</div>' +
        '<button type="button" class="usl-nav" data-nav="1" aria-label="Naslednji krogi">&#8250;</button>' +
        '</div>';
    }
    h += '<div class="usl-tabs"><button type="button" class="usl-tab' + (state.view === 'tekme' ? ' on' : '') + '" data-view="tekme">Tekme</button>' +
         '<button type="button" class="usl-tab' + (state.view === 'lestvica' ? ' on' : '') + '" data-view="lestvica">Lestvica</button></div></div>';

    h += '<div class="usl-body">';
    if (faze.length > 1) {
      h += '<div class="usl-filter">' + ['Vse'].concat(faze).map(function (f) {
        return '<button type="button" class="usl-chip' + (f === state.faza ? ' on' : '') + '" data-faza="' + esc(f) + '">' + esc(f) + '</button>';
      }).join('') + '</div>';
    }
    h += list.length ? (state.view === 'tekme' ? renderTekme(list) : renderLestvica(list)) : '<div class="usl-msg">Za ta šport še ni razporeda.</div>';
    h += '</div>';
    root.innerHTML = h;

    if (BANNER) {
      var head = root.querySelector('.usl-head');
      if (head) head.style.backgroundImage = "linear-gradient(90deg,rgba(1,74,102,.74) 0%,rgba(1,74,102,.74) 100%),url(" + JSON.stringify(BANNER) + ")";
    }

    var trak = root.querySelector('.usl-rounds');
    if (trak) {
      trak.addEventListener('scroll', osveziPuscice);
      var on = trak.querySelector('.usl-round.on');
      if (on) {
        trak.style.scrollBehavior = 'auto';   // prvo postavitev brez animacije
        trak.scrollLeft = on.offsetLeft - trak.clientWidth / 2 + on.clientWidth / 2;
        trak.style.scrollBehavior = '';
      }
      osveziPuscice();
    }
  }

  function obKliku(e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.nav) {                      // drsenje traku krogov, brez ponovnega izrisa
      var trak = root.querySelector('.usl-rounds');
      if (trak) trak.scrollLeft += Number(b.dataset.nav) * Math.max(180, trak.clientWidth * 0.8);
      return;
    }
    if (b.dataset.sport) { state.sport = b.dataset.sport; state.krog = null; state.faza = 'Vse'; }
    else if (b.dataset.view) state.view = b.dataset.view;
    else if (b.dataset.krog) state.krog = Number(b.dataset.krog);
    else if (b.dataset.faza) state.faza = b.dataset.faza;
    else return;
    render();
  }

  function refresh() {
    return load().then(function (novo) { if (novo) render(); });
  }

  // Ustavi vse, kar teče v ozadju. Pokliče se samo, ko bloka ni več na strani,
  // gostitelj (npr. WordPress gradnik) pa lahko tudi sam: document.getElementById('usl-liga').uslStop()
  function ustavi() {
    if (timer) { clearInterval(timer); timer = null; }
    window.removeEventListener('resize', osveziPuscice);
    document.removeEventListener('visibilitychange', obVidnosti);
    root.removeEventListener('click', obKliku);
    tekme = []; ekipe = {}; podpis = '';
    delete root.dataset.uslInit;
  }
  root.uslStop = ustavi;

  function obVidnosti() {
    if (!document.hidden && Date.now() - zadnjic > SVEZE) refresh().catch(function () {});
  }

  function tik() {
    if (!document.contains(root)) { ustavi(); return; }   // bloka ni več na strani
    if (document.hidden) return;                          // v skritem zavihku ne hodimo po podatke
    refresh().catch(function () {});
  }

  root.addEventListener('click', obKliku);
  window.addEventListener('resize', osveziPuscice);
  document.addEventListener('visibilitychange', obVidnosti);
  timer = setInterval(tik, SVEZE);

  refresh().catch(function (e) {
    root.innerHTML = '<div class="usl-msg">Podatkov trenutno ni mogoče naložiti. Poskusite znova pozneje.</div>';
    // Namig za urednika gre v konzolo, obiskovalec strani z njim nima kaj početi.
    if (window.console) console.warn('USL liga: podatkov ni bilo mogoče naložiti. Preveri, ali je Google Sheet deljen kot "Anyone with the link – Viewer".', e);
  });
})();
</script>
